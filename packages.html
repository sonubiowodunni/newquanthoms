<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0b10" />
<title>AD Packages -- BANQ</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<script src="js/app.js"></script>
<script src="js/ad-catalog.js"></script>
<script src="js/ad-page.js"></script>
</head>
<body>

<!-- Header -->
<header class="banq-header">
  <div class="banq-container banq-header-inner">
    <a href="/" class="banq-logo">
      <img src="assets/logo.svg" alt="BANQ" />
      <span>New Quanthoms</span>
    </a>
    <nav class="banq-nav">
      <a href="/">Feed</a>
      <a href="billboards.html">Billboards</a>
      <a href="packages.html">Packages</a>
      <a href="about.html">About</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="monitor.html">Monitor</a>
    </nav>
    <div id="banqUserArea"></div>
  </div>
</header>

<!-- Content -- rendered from js/ad-catalog.js by js/ad-page.js.
     No package name, price or bullet is written in this file, on purpose:
     that was how the page and the popup drifted apart. -->
<div class="banq-container" style="padding:24px 20px;max-width:1100px">
  <div id="banqPackagesPage"></div>
</div>

<!-- Footer -->
<footer class="banq-footer">
  <div class="banq-container">
    Billboard Agency for New Quanthoms (BANQ) -- A Quanthom Lumina company.
    In partnership with <a href="https://github.com/sonubiawodunni/qwkbrowser">QwkBrowser</a>.
  </div>
</footer>

<script>
(function() {
  'use strict';

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderUserArea() {
    var area = document.getElementById('banqUserArea');
    if (!area) return;
    if (BANQ.signedIn()) {
      var user = BANQ.getUser();
      var name = user ? (user.username || 'User') : 'User';
      area.innerHTML =
        '<div class="banq-user-badge"><span>' + esc(name) + '</span></div>' +
        '<button class="banq-signin-btn" id="banqLogoutBtn" style="margin-left:8px">Sign Out</button>';
      var btn = document.getElementById('banqLogoutBtn');
      if (btn) btn.addEventListener('click', function() { BANQ.logout(); });
    } else {
      area.innerHTML = '<a href="login.html?redirect=packages.html" class="banq-signin-btn">Sign In</a>';
    }
  }

  function init() {
    renderUserArea();
    BANQ.checkAuth().then(function(user) { if (user) renderUserArea(); });

    // The whole marketplace: four placements, two campaign packages, the BANQ
    // monitoring service and the QAP explainer. All from the catalog.
    if (window.BANQ_AD_PAGE) window.BANQ_AD_PAGE.mountPage('banqPackagesPage');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
